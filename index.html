<style>
:root{--bg:#faf8f4;--sf:#fff;--tx:#1d2733;--mu:#6b7683;--ac:#0f766e;--ac2:#e6f4f1;--bd:#e3ded3;--us:#0f766e;--ut:#fff;--cd:#f1eee7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--sf:#1c2229;--tx:#e8ecef;--mu:#98a3ae;--ac:#2dd4bf;--ac2:#16312e;--bd:#2c353e;--us:#0f766e;--ut:#fff;--cd:#242c35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181d;--sf:#1c2229;--tx:#e8ecef;--mu:#98a3ae;--ac:#2dd4bf;--ac2:#16312e;--bd:#2c353e;--us:#0f766e;--ut:#fff;--cd:#242c35;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--sf)}
header .lg{width:36px;height:36px;border-radius:10px;object-fit:cover}
header h1{font-size:17px;margin:0;line-height:1.2}
header small{color:var(--mu);font-size:12px}
header #inst{margin-left:auto}header #inst[hidden]+#memb{margin-left:auto}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:8px;padding:6px 10px;font-size:13px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:min(720px,92%);padding:10px 14px;border-radius:14px;word-wrap:break-word;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--us);color:var(--ut);border-bottom-right-radius:4px;white-space:pre-wrap}
.m.a{align-self:flex-start;background:var(--sf);border:1px solid var(--bd);border-bottom-left-radius:4px}
.m p{margin:0 0 8px}.m p:last-child,.m ul:last-child,.m ol:last-child{margin-bottom:0}
.m h3,.m h4{margin:10px 0 4px;font-size:16px}
.m ul,.m ol{margin:0 0 8px;padding-left:22px}
.m code{background:var(--cd);padding:1px 5px;border-radius:5px;font-size:.9em}
.m pre{background:var(--cd);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0;position:relative}
.m pre code{background:none;padding:0}
.cp{position:absolute;top:4px;right:4px;font-size:11px;padding:2px 6px}
.hero{margin:auto;text-align:center;max-width:520px;padding:12px}
.hero .rob{width:min(300px,78%);height:auto;display:block;margin:0 auto 4px}
.hero h2{margin:6px 0}
.hero p{color:var(--mu);margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--ac2);color:var(--ac);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font-size:14px}
#bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd);background:var(--sf)}
#in{flex:1;resize:none;max-height:140px;min-height:44px;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--tx)}
#send{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:600}
:root[data-theme="dark"] #send,@media (prefers-color-scheme:dark){}
#send:disabled{opacity:.5}
.err{color:#c0392b;font-size:14px;align-self:center}
[hidden]{display:none!important}
#pend{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0;background:var(--sf);border-top:1px solid var(--bd)}
#pend span{background:var(--ac2);color:var(--ac);border-radius:999px;padding:3px 10px;font-size:13px}
#att,#mic{font-size:18px;padding:0 12px;border-radius:12px}
.spk{display:block;margin-top:8px;font-size:12px;padding:3px 8px}
#pan,#pan2{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#pan .box,#pan2 .box{background:var(--sf);border-radius:14px;padding:16px;width:min(560px,100%);max-height:100%;overflow:auto}
#pan h3,#pan2 h3{margin:0 0 4px}#pan p,#pan2 p{color:var(--mu);font-size:14px;margin:0 0 8px}
#mem{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--tx);resize:vertical}
#pan .row,#pan2 .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#ms,#cs{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:600}
#pan2 label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}#pan2 input{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--tx)}#pan2 a{color:var(--ac)}
</style>
</head>

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')}
function md(t){
  const parts=t.split(/```/);let out='';
  parts.forEach((p,i)=>{
    if(i%2){const nl=p.indexOf('\n');out+='<pre><button class="ghost cp">Copier</button><code>'+esc(nl>=0?p.slice(nl+1):p)+'</code></pre>';return}
    let list=null;
    const close=()=>{if(list){out+='</'+list+'>';list=null}};
    p.split('\n').forEach(l=>{
      let m;
      if(m=l.match(/^#{1,4}\s+(.*)/)){close();out+='<h3>'+inline(m[1])+'</h3>'}
      else if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){close();out+='<ul>';list='ul'}out+='<li>'+inline(m[1])+'</li>'}
      else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();out+='<ol>';list='ol'}out+='<li>'+inline(m[1])+'</li>'}
      else if(l.trim()===''){close()}
      else{close();out+='<p>'+inline(l)+'</p>'}
    });close();
  });
  return out;
}

function render(){
  if(!hist.length){hero();return}
  log.innerHTML='';hist.forEach(m=>add(m.role,m.shown||m.content));
}
async function send(text){
  text=(text||inp.value).trim();
  if(!text&&(imgs.length||txts.length))text='Analyse ce que je t\'ai joint.';
  if(!text||busy)return;
  if(!hist.length)log.innerHTML='';
  inp.value='';inp.style.height='auto';
  const ims=imgs,tx=txts;imgs=[];txts=[];showPend();
  const shown=text+(tx.length?'\n📄 '+tx.map(f=>f.name).join(', '):'')+(ims.length?'\n🖼️ '+ims.length+' photo(s)':'');
  const content=text+tx.map(f=>'\n\n[Fichier joint : '+f.name+']\n'+f.text.slice(0,12000)).join('')+(ims.length?'\n\n(Photos jointes à ce message : '+ims.length+')':'');
  if(synth){synth.cancel();if(voxOn)synth.speak(new SpeechSynthesisUtterance(''))}
  hist.push({role:'user',content,shown});add('user',shown);save();
  busy=true;btn.disabled=true;
  const box=add('assistant','…');
  const msgs=hist.slice(-20).map(m=>({role:m.role,content:m.content}));while(msgs.length&&msgs[0].role!=='user')msgs.shift();
  try{
    const r=await groqChat([{role:'system',content:sysText()}].concat(msgs),{images:ims,onText:t=>{box.innerHTML=md(t);log.scrollTop=log.scrollHeight}});
    hist.push({role:'assistant',content:r.text});box.innerHTML=md(r.text);addSpk(box);save();if(voxOn)speakEl(box);
  }catch(e){
    box.remove();hist.pop();
    const m=e&&e.code==='rate_limited'?'Trop de demandes. Attends un instant et réessaie.':e&&e.code==='bad_key'?'Clé Groq refusée. Vérifie-la dans ⚙️.':e&&e.code==='network'?'Connexion impossible. Vérifie ton internet.':e&&e.msg?'Erreur Groq : '+e.msg:'Une erreur est survenue. Réessaie.';
    log.insertAdjacentHTML('beforeend','<div class="err">'+m+'</div>');
  }
  busy=false;btn.disabled=false;log.scrollTop=log.scrollHeight;
}
btn.onclick=()=>send();
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px'});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}});
document.getElementById('new').onclick=()=>{if(busy)return;hist=[];save();render()};
const MK='genie_mem_v1';let memo='';try{memo=localStorage.getItem(MK)||''}catch(e){}
const pan=document.getElementById('pan'),mem=document.getElementById('mem');
document.getElementById('memb').onclick=()=>{mem.value=memo;pan.hidden=false};
document.getElementById('mc').onclick=()=>{pan.hidden=true};
document.getElementById('ms').onclick=()=>{memo=mem.value.trim();try{localStorage.setItem(MK,memo)}catch(e){}pan.hidden=true};
function sysText(){return SYS0+userCtx()+(voxOn?'\n\nMode vocal activé : ta réponse sera lue à voix haute. Réponds en phrases courtes et naturelles, comme à l\'oral, sans tableaux ni long code, sauf demande explicite.':'')+(memo?'\n\nMémoire de l\'utilisateur (projets et infos à garder en tête dans toute la conversation) :\n'+memo:'')}
let imgs=[],txts=[];const pend=document.getElementById('pend'),fl=document.getElementById('fl');
function showPend(){pend.innerHTML='';[...imgs.map(f=>'🖼️ '+f.name),...txts.map(f=>'📄 '+f.name)].forEach(n=>{const s=document.createElement('span');s.textContent=n;pend.appendChild(s)});if(imgs.length||txts.length){const x=document.createElement('span');x.textContent='✕ Retirer';x.style.cursor='pointer';x.onclick=()=>{imgs=[];txts=[];showPend()};pend.appendChild(x)}pend.hidden=!(imgs.length||txts.length)}
document.getElementById('att').onclick=()=>fl.click();
fl.onchange=async()=>{
  const okImg=true;
  for(const f of fl.files){
    if(f.type.startsWith('image/')){if(okImg&&imgs.length<4)imgs.push(f);else log.insertAdjacentHTML('beforeend','<div class="err">Photos non disponibles ici.</div>')}
    else if(f.size<2e6){try{txts.push({name:f.name,text:await f.text()})}catch(e){}}
  }
  fl.value='';showPend();
};
const synth=window.speechSynthesis;let voxOn=false;try{voxOn=localStorage.getItem('genie_vox')==='1'}catch(e){}
const vx=document.getElementById('vx');
function vxUi(){vx.textContent=voxOn?'🔊':'🔇';vx.title=voxOn?'Voix activée':'Voix désactivée'}
if(!synth)vx.hidden=true;else vxUi();
vx.onclick=()=>{voxOn=!voxOn;try{localStorage.setItem('genie_vox',voxOn?'1':'0')}catch(e){}if(!voxOn)synth.cancel();else synth.speak(new SpeechSynthesisUtterance(''));vxUi()};
function addSpk(d){if(!synth||d.querySelector('.spk'))return;const b=document.createElement('button');b.className='ghost spk';b.textContent='🔊 Écouter';d.appendChild(b)}
function pickVoice(){const v=synth.getVoices();return v.find(x=>/^fr/i.test(x.lang)&&/google|natural|online|neural/i.test(x.name))||v.find(x=>/^fr/i.test(x.lang))||null}
function speakEl(el){
  if(!synth)return;synth.cancel();
  const c=el.cloneNode(true);c.querySelectorAll('pre,button').forEach(x=>x.remove());
  c.querySelectorAll('p,li,h3').forEach(x=>x.append('. '));
  const t=(c.textContent||'').replace(/\s+/g,' ').trim();if(!t)return;
  const parts=[];let cur='';(t.match(/[^.!?]+[.!?]*\s*/g)||[t]).forEach(s=>{if((cur+s).length>180&&cur){parts.push(cur);cur=s}else cur+=s});if(cur)parts.push(cur);
  const v=pickVoice();
  parts.forEach(p=>{const u=new SpeechSynthesisUtterance(p);u.lang='fr-FR';if(v)u.voice=v;synth.speak(u)});
}
log.addEventListener('click',e=>{if(e.target.classList.contains('spk')){if(synth.speaking){synth.cancel();return}speakEl(e.target.parentElement)}});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=document.getElementById('mic');
if(!SR)mic.hidden=true;else{
  let rec=null,on=false;
  mic.onclick=()=>{
    if(on){if(rec)rec.stop();return}
    if(synth)synth.cancel();
    rec=new SR();rec.lang='fr-FR';rec.interimResults=true;rec.continuous=false;
    const base=inp.value?inp.value+' ':'';let heard=false;
    rec.onresult=e=>{heard=true;let t='';for(const r of e.results)t+=r[0].transcript;inp.value=base+t;inp.dispatchEvent(new Event('input'))};
    rec.onstart=()=>{on=true;mic.textContent='⏹️'};
    rec.onend=()=>{on=false;mic.textContent='🎤';if(voxOn&&heard&&inp.value.trim())send()};
    rec.onerror=e=>{on=false;mic.textContent='🎤';log.insertAdjacentHTML('beforeend','<div class="err">'+(e.error==='not-allowed'||e.error==='service-not-allowed'?'Micro non autorisé ici. Autorise le micro, ou utilise le micro du clavier de ton téléphone.':'Micro indisponible.')+'</div>')};
    try{rec.start()}catch(x){}
  };
}

/* ===== Groq ===== */
const GN='genie_name';
const WORKER='https://genie.boubacardraga123.workers.dev';
const GK='genie_groq_key',GM='genie_groq_model',GV='genie_groq_vmodel';
const DEF_M='llama-3.3-70b-versatile',DEF_V='meta-llama/llama-4-scout-17b-16e-instruct';
function gget(k,d){try{return(localStorage.getItem(k)||'').trim()||d}catch(e){return d}}
function gset(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k)}catch(e){}}
const pan2=document.getElementById('pan2');
function openCfg(){document.getElementById('gn').value=gget(GN,'');document.getElementById('gm').value=gget(GM,'');document.getElementById('gv').value=gget(GV,'');pan2.hidden=false}
document.getElementById('cfg').onclick=openCfg;
document.getElementById('cc').onclick=()=>{pan2.hidden=true};
document.getElementById('cs').onclick=()=>{
  gset(GN,document.getElementById('gn').value.trim());
  gset(GM,document.getElementById('gm').value.trim());
  gset(GV,document.getElementById('gv').value.trim());
  pan2.hidden=true;
  if(!hist.length)render();
};
function toDataUrl(f){
  return new Promise((ok,ko)=>{
    const u=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{
      const M=1280,r=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.85));
    };
    im.onerror=()=>{URL.revokeObjectURL(u);ko(new Error('img'))};
    im.src=u;
  });
}
async function groqChat(messages,opt){
  opt=opt||{};
    const ims=opt.images||[];
  if(ims.length){
    const urls=await Promise.all(ims.map(toDataUrl));
    const last=messages[messages.length-1];
    last.content=[{type:'text',text:last.content}].concat(urls.map(u=>({type:'image_url',image_url:{url:u}})));
  }
  const model=ims.length?gget(GV,DEF_V):gget(GM,DEF_M);
  let res;
  try{
    res=await fetch(WORKER,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:model,messages:messages,stream:true,temperature:.7,max_tokens:4096})
    });
  }catch(e){throw{code:'network'}}
  if(!res.ok){
    let msg='';try{msg=(await res.json()).error.message}catch(e){}
    throw{code:res.status===401?'bad_key':res.status===429?'rate_limited':'http',msg:msg};
  }
  const rd=res.body.getReader(),dec=new TextDecoder();
  let buf='',text='';
  for(;;){
    const x=await rd.read();if(x.done)break;
    buf+=dec.decode(x.value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const l of lines){
      if(!l.startsWith('data:'))continue;
      const d=l.slice(5).trim();if(!d||d==='[DONE]')continue;
      try{const t=JSON.parse(d).choices[0].delta.content;if(t){text+=t;if(opt.onText)opt.onText(text)}}catch(e){}
    }
  }
  if(!text)throw{code:'http',msg:'réponse vide'};
  return{text:text};
}
